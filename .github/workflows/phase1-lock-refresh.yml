name: Temporary composer security lock refresh

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'feat/web-phase1-customer-foundation' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, fileinfo, exif, gd, zip
      - name: Configure GitHub archive authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: composer config --global github-oauth.github.com "$GH_TOKEN"
      - name: Resolve safe dependency versions
        run: composer update --no-interaction --prefer-dist --no-progress --with-all-dependencies
      - name: Audit updated lock
        run: composer audit --locked --no-dev
      - name: Commit updated lock to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh security-patched Composer lock versions"
            git push origin HEAD:feat/web-phase1-customer-foundation
          fi
