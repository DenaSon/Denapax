name: Resolve SMS.ir Composer lock

on:
  push:
    branches: [integration/smsir-customer-otp]
    paths:
      - composer.json
      - .github/workflows/smsir-dependency-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Configure GitHub archive authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: composer config --global github-oauth.github.com "$GH_TOKEN"

      - name: Resolve and lock the official SDK
        run: composer update ipe/smsir-php --with-dependencies --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Commit generated lock file
        run: |
          if git diff --quiet -- composer.lock; then
            echo "composer.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "chore: lock SMS.ir SDK dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
