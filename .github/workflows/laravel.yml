name: Laravel foundation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: mbstring, pdo_sqlite, fileinfo, exif, gd, zip

      - name: Configure GitHub archive authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: composer config --global github-oauth.github.com "$GH_TOKEN"

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit locked production dependencies
        run: composer audit --locked --no-dev

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Temporary bootstrap: generate the lockfile on GitHub's runner, commit it to
      # this same-repository PR branch, then remove this block in the final CI.
      - name: Generate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated npm lockfile (temporary bootstrap)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(deps): add npm lockfile"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Upload generated npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile-bootstrap
          path: package-lock.json
          if-no-files-found: error

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile admin assets
        run: npm run build
