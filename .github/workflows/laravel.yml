name: Laravel foundation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: mbstring, pdo_sqlite, fileinfo, exif, gd, zip

      - name: Configure GitHub archive authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: composer config --global github-oauth.github.com "$GH_TOKEN"

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit locked production dependencies
        run: composer audit --locked --no-dev

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Preview exact formatter output (temporary phase-7 check)
        run: |
          vendor/bin/pint > /dev/null
          for f in app/Integrations/Telegram/CartCheckoutMessages.php app/Integrations/Telegram/CatalogMessages.php tests/Feature/TelegramCatalogCartUxTest.php tests/Feature/TelegramCheckoutStatusUxTest.php; do
            echo "PINT_FILE_BEGIN $f"
            cat "$f"
            echo "PINT_FILE_END $f"
          done

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Compile admin assets
        run: npm run build
